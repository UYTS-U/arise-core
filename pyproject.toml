[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arise-core"
version = "0.1.0"
description = "Adaptive Recommendation from Interests and Shared Evidence"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = ["numpy==1.24.3", "scipy==1.10.1", "pandas>=1.5,<3", "torch==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py38"
